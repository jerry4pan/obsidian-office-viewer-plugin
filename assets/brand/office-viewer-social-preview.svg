<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 1280 640"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Office Viewer social preview</title>
  <desc id="description">
    Office Viewer turns local PPTX presentations into searchable,
    source-preserving knowledge in Obsidian.
  </desc>
  <defs>
    <clipPath id="screenshot-clip">
      <rect x="670" y="108" width="550" height="390" rx="16" />
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="#211A35" />

  <image
    x="66"
    y="58"
    width="92"
    height="92"
    href="office-viewer-mark.svg"
    xlink:href="office-viewer-mark.svg"
  />
  <text
    x="178"
    y="120"
    fill="#F8F6FF"
    font-family="Avenir Next, Avenir, Arial, sans-serif"
    font-size="42"
    font-weight="600"
    letter-spacing="-1"
  >Office Viewer</text>

  <text
    x="70"
    y="245"
    fill="#F8F6FF"
    font-family="Avenir Next, Avenir, Arial, sans-serif"
    font-size="50"
    font-weight="600"
    letter-spacing="-1.5"
  >
    <tspan x="70" dy="0">Turn local PPTX into</tspan>
    <tspan x="70" dy="62">searchable knowledge.</tspan>
  </text>

  <text
    x="72"
    y="398"
    fill="#DCD6F8"
    font-family="Avenir Next, Avenir, Arial, sans-serif"
    font-size="25"
    font-weight="500"
  >Read · Search · Reference · Embed</text>
  <text
    x="72"
    y="442"
    fill="#BEB6E4"
    font-family="Avenir Next, Avenir, Arial, sans-serif"
    font-size="21"
  >Local, read-only, and source-preserving.</text>

  <rect x="650" y="88" width="590" height="430" rx="16" fill="#F8F6FF" />
  <image
    x="670"
    y="108"
    width="550"
    height="390"
    href="../readme/hero-reading-view.png"
    xlink:href="../readme/hero-reading-view.png"
    clip-path="url(#screenshot-clip)"
    preserveAspectRatio="xMidYMid slice"
  />

  <path
    d="M72 556h58"
    fill="none"
    stroke="#F2B45F"
    stroke-linecap="round"
    stroke-width="7"
  />
  <text
    x="151"
    y="565"
    fill="#DCD6F8"
    font-family="Avenir Next, Avenir, Arial, sans-serif"
    font-size="20"
    font-weight="500"
  >A Jerry Pan project</text>
</svg>
